<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-label="A scorecard with sectional bars and an overall score measured against cutoff lines">
  <rect width="480" height="180" fill="#F2EDDF"/>
  <rect x="60" y="20" width="360" height="140" rx="22" fill="#FFFFFF" stroke="#073B43" stroke-width="3"/>
  <!-- header skeleton -->
  <rect x="86" y="36" width="58" height="8" rx="4" fill="#0F6F7A" opacity=".3"/>
  <rect x="252" y="36" width="84" height="8" rx="4" fill="#0F6F7A" opacity=".3"/>
  <!-- divider -->
  <path d="M232 36 V146" stroke="#D3E8F6" stroke-width="3" stroke-linecap="round"/>
  <!-- sectional bars -->
  <path d="M80 142 H216" stroke="#073B43" stroke-width="3" stroke-linecap="round"/>
  <rect x="92" y="62" width="30" height="80" rx="8" fill="#0F6F7A"/>
  <rect x="138" y="96" width="30" height="46" rx="8" fill="#0F6F7A" opacity=".35"/>
  <rect x="184" y="70" width="30" height="72" rx="8" fill="#C6F24E" stroke="#073B43" stroke-width="3"/>
  <path d="M80 80 H216" stroke="#073B43" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>
  <!-- overall bar with cutoff tick -->
  <rect x="252" y="66" width="152" height="18" rx="9" fill="#D3E8F6"/>
  <rect x="252" y="66" width="116" height="18" rx="9" fill="#C6F24E" stroke="#073B43" stroke-width="2.5"/>
  <path d="M330 56 V94" stroke="#073B43" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="330,56 344,61 330,67" fill="#073B43"/>
  <!-- pass seal -->
  <circle cx="328" cy="122" r="19" fill="#C6F24E" stroke="#073B43" stroke-width="3"/>
  <path d="M319 122 l7 8 l13 -15" fill="none" stroke="#073B43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="356" y="116" width="48" height="8" rx="4" fill="#0F6F7A" opacity=".3"/>
  <rect x="356" y="130" width="34" height="8" rx="4" fill="#0F6F7A" opacity=".2"/>
  <rect x="252" y="116" width="0" height="0"/>
</svg>
