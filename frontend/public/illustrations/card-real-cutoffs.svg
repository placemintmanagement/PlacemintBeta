  <path d="M16 70 H184" stroke="#073B43" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>
  <!-- bars -->
  <rect x="28" y="92" width="36" height="42" rx="8" fill="#0F6F7A" opacity=".4"/>
  <rect x="76" y="46" width="36" height="88" rx="8" fill="#C6F24E" stroke="#073B43" stroke-width="3"/>
  <rect x="124" y="84" width="36" height="50" rx="8" fill="#0F6F7A"/>
