<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Resume, code and interview feeding one report">
  <!-- connectors -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".65">
    <path d="M40 66 V94"/><path d="M100 66 V94"/><path d="M160 66 V94"/>
  </g>
  <!-- nodes -->
  <circle cx="40" cy="44" r="22" fill="#FFFFFF"/>
  <circle cx="100" cy="44" r="22" fill="#FFFFFF"/>
  <circle cx="160" cy="44" r="22" fill="#FFFFFF"/>
  <!-- resume -->
  <rect x="31" y="32" width="18" height="24" rx="4.5" fill="none" stroke="#0F6F7A" stroke-width="3.5"/>
  <rect x="35.5" y="39" width="9" height="3.5" rx="1.75" fill="#0F6F7A"/>
  <rect x="35.5" y="46" width="6" height="3.5" rx="1.75" fill="#0F6F7A"/>
  <!-- code -->
  <g fill="none" stroke="#0F6F7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 38 l-8 6 l8 6"/><path d="M108 38 l8 6 l-8 6"/>
  </g>
  <path d="M103 36 l-6 16" stroke="#0F6F7A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- chat -->
  <polygon points="152,56 150,64 160,57" fill="#0F6F7A"/>
  <rect x="148" y="33" width="26" height="22" rx="9" fill="#0F6F7A"/>
  <circle cx="156" cy="44" r="2.4" fill="#FFFFFF"/><circle cx="161" cy="44" r="2.4" fill="#FFFFFF"/><circle cx="166" cy="44" r="2.4" fill="#FFFFFF" opacity=".55"/>
  <!-- report -->
  <rect x="16" y="96" width="168" height="46" rx="16" fill="#FFFFFF"/>
  <rect x="34" y="109" width="70" height="9" rx="4.5" fill="#0F6F7A"/>
  <rect x="34" y="124" width="44" height="9" rx="4.5" fill="#0F6F7A" opacity=".3"/>
  <circle cx="154" cy="119" r="17" fill="#073B43"/>
  <path d="M146 119 l6 7 l11 -13" fill="none" stroke="#C6F24E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
